name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: it mints an OIDC token to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This repo is the PREVIEW, served from a subpath at
      # infosci.github.io/datalab-next/, so every asset and link needs that
      # prefix (see next.config.ts). On the real site, served at the root of
      # datalab.yonsei.ac.kr, BASE_PATH is simply left unset.
      - run: npm run build
        env:
          BASE_PATH: /datalab-next

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
